org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The project path has non-ASCII characters (学习通PLUS), which AGP rejects by default.
# Building through an ASCII junction (e.g. D:\Claude\xxtplus) avoids it entirely.
# Python used at build time by Chaquopy must be a full Python 3.13 (with venv); by default
# it is found with `py -3.13`. Override if needed:
# xxtplus.buildPython=C:\\Path\\To\\python.exe

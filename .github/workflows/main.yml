name: CI

# Checks for every push and pull request (P7). Nothing here signs or publishes a release:
# release builds are made locally (build_windows.ps1, gradlew assembleRelease with the
# release key, which is never stored in the repository).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt PySide6-Essentials PySide6-Addons
      - name: Run tests
        run: python -m unittest discover -s tests -v

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy needs a build Python of the same version as the app's (3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pxxtplus.buildPython=$(which python3.13 || which python)
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
